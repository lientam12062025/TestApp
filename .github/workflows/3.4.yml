name: Auto Build 3.4

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: 'OTA URL for ROM (legacy/single build)'
        required: true
        type: string
      ROM_URLS_JSON:
        description: 'JSON array of OTA URLs for one batch workflow run'
        required: false
        default: ''
        type: string
      BUILD_REGION:
        description: 'Batch target: CN or GL'
        required: false
        default: ''
        type: string

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          overprovision-lvm: 'true'

      - name: Checkout Runner Repo
        uses: actions/checkout@v4

      - name: Determine branch
        id: pick_branch
        env:
          BUILD_REGION: ${{ inputs.BUILD_REGION }}
          LEGACY_ROM_URL: ${{ inputs.ROM_URL }}
        run: |
          if [[ "${BUILD_REGION^^}" == "GL" ]]; then
            echo "branch=3.4G" >> "$GITHUB_OUTPUT"
            echo "Target: Global (3.4G)"
          elif [[ "${BUILD_REGION^^}" == "CN" ]]; then
            echo "branch=3.4" >> "$GITHUB_OUTPUT"
            echo "Target: China (3.4)"
          elif [[ "$LEGACY_ROM_URL" == *[Gg]lobal* ]]; then
            echo "branch=3.4G" >> "$GITHUB_OUTPUT"
            echo "Target: Global legacy build (3.4G)"
          else
            echo "branch=3.4" >> "$GITHUB_OUTPUT"
            echo "Target: China/other legacy build (3.4)"
          fi

      - name: Clone HyperTN_Code
        run: |
          echo "Đang tải nhánh ${{ steps.pick_branch.outputs.branch }} ..."
          git clone --depth 1 --single-branch --branch "${{ steps.pick_branch.outputs.branch }}" \
            "https://oauth2:${{ secrets.TNKEY }}@github.com/thangnguyen2303/HyperTN_Code.git" HyperTN_Code
          echo "Tải mã nguồn thành công!"

      - name: Set up environment
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xmlstarlet bc aria2 python3 p7zip-full zipalign apksigner \
            android-sdk-libsparse-utils lz4 xz-utils zlib1g-dev \
            openjdk-17-jdk gcc g++ python-is-python3
          sudo pip3 install pycryptodome
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Setup Cloudflare WARP Proxy
        run: |
          echo "Nhúng key bảo mật của Cloudflare..."
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          echo "Cấu hình WARP chạy SOCKS5 Proxy..."
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect

          echo "Đợi 5 giây để kết nối..."
          sleep 5

          echo "Kiểm tra IP đã được Fake thành công chưa:"
          curl -s -x socks5h://127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | grep warp

      - name: Run Auto Build TN
        env:
          HTTPS_PROXY: socks5://127.0.0.1:40000
          HTTP_PROXY: socks5://127.0.0.1:40000
          ROM_URLS_JSON: ${{ inputs.ROM_URLS_JSON }}
          LEGACY_ROM_URL: ${{ inputs.ROM_URL }}
        run: |
          cd HyperTN_Code
          sudo chmod -R +x .

          export ROM_LIST_FILE="$RUNNER_TEMP/rom_urls.txt"
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          raw = os.environ.get("ROM_URLS_JSON", "").strip()
          urls = json.loads(raw) if raw else [os.environ.get("LEGACY_ROM_URL", "").strip()]
          if not isinstance(urls, list) or not urls:
              raise SystemExit("ROM URL list is empty or invalid")

          clean_urls = []
          for url in urls:
              if not isinstance(url, str):
                  raise SystemExit("Every ROM URL must be a string")
              url = url.strip()
              parsed = urlparse(url)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit(f"Invalid ROM URL: {url!r}")
              clean_urls.append(url)

          with open(os.environ["ROM_LIST_FILE"], "w", encoding="utf-8") as handle:
              handle.write("\n".join(clean_urls) + "\n")
          print(f"Validated {len(clean_urls)} ROM URL(s)")
          PY

          total=$(wc -l < "$ROM_LIST_FILE")
          current=0
          while IFS= read -r rom_url || [[ -n "$rom_url" ]]; do
            [[ -z "$rom_url" ]] && continue
            current=$((current + 1))
            echo "[$current/$total] Building: $rom_url"
            sudo --preserve-env=HTTPS_PROXY,HTTP_PROXY bash BuildTN.sh "$rom_url"
          done < "$ROM_LIST_FILE"

      - name: 🔄 Checkout Website Repo
        uses: actions/checkout@v4
        with:
          repository: thangnguyen2303/hypertn-site
          token: ${{ secrets.TNWEB }}
          path: website-repo

      - name: 📝 Update roms.json & Push
        run: |
          echo "Dang quet file tu Drive..."
          rclone listremotes
          rclone lsjson "gdrive39:/TN/ROM" -R --files-only --no-mimetype --no-modtime --include "*.7z" > website-repo/src/data/roms1.json
          rclone lsjson "gdrive3:/TN/ROM" -R --files-only --no-mimetype --no-modtime --include "*.7z" > website-repo/src/data/roms2.json

          cd website-repo
          git config --global user.name "Thang Nguyen"
          git config --global user.email "nvthang2303@outlook.com.vn"

          if [[ -n $(git status -s) ]]; then
            git add src/data/*.json
            git commit -m "🤖 Auto-update ROM List: $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Da cap nhat Website thanh cong!"
          else
            echo "💤 Khong co file ROM moi, bo qua update web."
          fi
